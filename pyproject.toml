[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch-sentinel"
version = "0.1.0"
description = "Guardian en tiempo de fetch para agentes autonomos: defensa estructural contra inyeccion de prompts en contenido web."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]
requires-python = ">=3.11"
keywords = ["security", "prompt-injection", "agent-security", "web-fetch", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp-tool-sanitizer>=0.1.0",
    "agent-trace-witness>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/amurlaniakea/fetch-sentinel"
Repository = "https://github.com/amurlaniakea/fetch-sentinel"
Issues = "https://github.com/amurlaniakea/fetch-sentinel/issues"

[project.scripts]
fetch-sentinel = "main:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"