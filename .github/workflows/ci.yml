name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel runs concurrent en la misma rama/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout fetch-sentinel
        uses: actions/checkout@v4

      # KI-4: las dos dependencias no están publicadas en PyPI. Hay que
      # clonarlas en el workspace (no en ../, que GitHub Actions bloquea
      # por seguridad) e instalarlas editable. URLs públicas verificadas
      # en el AGENTS.md del repo.
      - name: Checkout mcp-tool-sanitizer
        uses: actions/checkout@v4
        with:
          repository: amurlaniakea/mcp-tool-sanitizer
          path: .deps/mcp-tool-sanitizer

      - name: Checkout agent-trace-witness
        uses: actions/checkout@v4
        with:
          repository: amurlaniakea/agent-trace-witness
          path: .deps/agent-trace-witness

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fetch-sentinel (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install sibling deps (editable, local clones)
        # KI-4: -e desde path local, NO PyPI. PyPI puede diferir del local.
        run: |
          pip install -e .deps/mcp-tool-sanitizer
          pip install -e .deps/agent-trace-witness

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Syntax check
        run: python -m compileall -q core/ main.py

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
